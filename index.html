<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Borderless Apps</title>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; max-width: 800px; margin: 60px auto; padding: 0 24px; color: #1a1a1a; }
    h1 { font-size: 2rem; margin-bottom: 8px; }
    p.tagline { color: #555; margin-bottom: 48px; }
    .apps { display: flex; gap: 24px; flex-wrap: wrap; }
    .app-card { border: 1px solid #e0e0e0; border-radius: 12px; padding: 24px; flex: 1; min-width: 220px; }
    .app-card h2 { margin: 0 0 8px; }
    .app-card p { color: #666; font-size: 0.9rem; margin: 0 0 16px; }
    .app-card a { display: inline-block; margin-right: 12px; font-size: 0.85rem; color: #0070f3; text-decoration: none; }
    .app-card a:hover { text-decoration: underline; }
    footer { margin-top: 64px; font-size: 0.8rem; color: #999; }
  </style>
</head>
<body>
  <h1>Borderless Apps</h1>
  <p class="tagline">Useful apps, built for everyone.</p>

  <div class="apps">

    <div class="app-card">
      <h2>WireWise</h2>
      <p>Smart electrical wiring assistant.</p>
      <a href="/WireWise/Marketing">Marketing</a>
      <a href="/WireWise/PrivacyPolicy">Privacy Policy</a>
      <a href="/WireWise/Support">Support</a>
    </div>

    <div class="app-card">
      <h2>RepairScan</h2>
      <p>AI-powered repair diagnosis tool.</p>
      <a href="/RepairScan/Marketing">Marketing</a>
      <a href="/RepairScan/PrivacyPolicy">Privacy Policy</a>
      <a href="/RepairScan/Support">Support</a>
    </div>

  </div>

  <footer>&copy; 2026 Borderless Apps. All rights reserved.</footer>
</body>
</html>
