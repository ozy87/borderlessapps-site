# Vale configuration for the site repo (see README.md in the hub template folder).
# Vale lints .html files natively: it parses the markup and checks only the visible
# prose, skipping <code>, <pre>, <script>, <style> and tag attributes.
StylesPath = styles
# Only errors fail the check; the Growth rules are all errors.
MinAlertLevel = error

[*.html]
BasedOnStyles = Growth
